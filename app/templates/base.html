<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}Доставка{% endblock %} - Sieshka</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

  <style nonce="{{ csp_nonce }}">
    body { background: #f7f7f8; }
    .price { font-weight: 700; }
    .sticky-cartbar {
      position: sticky; bottom: 0; z-index: 1020;
      background: rgba(255,255,255,.95); backdrop-filter: blur(6px);
      border-top: 1px solid rgba(0,0,0,.08);
    }
    .product-img {
      width: 72px; height: 72px; object-fit: cover; border-radius: 12px;
      background: #e9ecef;
    }
    .qty-btn {
      width: 32px;
      height: 32px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-brand-call {
      background-color: #DD291B;
      color: white;
      border: none;
      border-radius: 50px;
      padding: 6px 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      font-size: 0.875rem;
      transition: opacity 0.2s;
    }
    .btn-brand-call:hover {
      color: white;
      opacity: 0.85;
    }
    .btn-brand-call svg {
      fill: currentColor;
    }
    .skeleton {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }
    .slot-full {
      color: #dc3545;
      text-decoration: line-through;
    }
    .slot-available {
      color: #198754;
    }
  </style>

  <script defer src="/static/app.js"></script>
  {% block head %}{% endblock %}
</head>

<body>
<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
  <div class="container">
    <a class="navbar-brand" href="/">
      <img src="/static/logo.png" alt="Sieshka Logo" height="40" style="width: auto;">
    </a>

    <div class="ms-auto d-flex gap-2">
      <a class="btn btn-outline-secondary btn-sm position-relative" href="/cart">
        Корзина
        <span id="cartBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none">
          0
        </span>
      </a>
      <a class="btn-brand-call" href="tel:+79641027995">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-telephone-outbound-fill" viewBox="0 0 16 16">
          <path fill-rule="evenodd" d="M1.885.511a1.745 1.745 0 0 1 2.61.163L6.29 2.98c.329.423.445.974.315 1.494l-.547 2.19a.68.68 0 0 0 .178.643l2.457 2.457a.68.68 0 0 0 .644.178l2.189-.547a1.75 1.75 0 0 1 1.494.315l2.306 1.794c.829.645.905 1.87.163 2.611l-1.034 1.034c-.74.74-1.846 1.065-2.877.702a18.6 18.6 0 0 1-7.01-4.42 18.6 18.6 0 0 1-4.42-7.009c-.362-1.03-.037-2.137.703-2.877L1.885.511zM11 .5a.5.5 0 0 1 .5-.5h4a.5.5 0 0 1 .5.5v4a.5.5 0 0 1-1 0V1.707l-4.146 4.147a.5.5 0 0 1-.708-.708L14.293 1H11.5a.5.5 0 0 1-.5-.5z"/>
        </svg>
        Позвонить
      </a>
    </div>
  </div>
</nav>

{% if preview_period %}
<div class="container mt-3">
  <div class="alert alert-warning py-2">
    <strong>PREVIEW:</strong> {{ preview_period }}
    <a class="ms-2" href="/admin/preview?period=morning">Утро</a>
    <a class="ms-2" href="/admin/preview?period=evening">Вечер</a>
    <a class="ms-2" href="/">Обычный</a>
  </div>
</div>
{% endif %}

<main class="container py-3">
  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
{% block scripts %}{% endblock %}
</body>
</html>
