<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}Доставка{% endblock %} - Sieshka</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="/static/css/theme.css" rel="stylesheet">

  <style nonce="{{ csp_nonce }}">
    /* Additional page-specific styles */
    .skeleton {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .5; }
    }
  </style>

  <script defer src="/static/app.js"></script>
  {% block head %}{% endblock %}
</head>

<body>
<nav class="navbar navbar-expand-lg sticky-top">
  <div class="container">
    <a class="navbar-brand" href="/">
      <img src="/static/logo.png" alt="Sieshka Logo" height="40" style="width: auto;">
    </a>

    <div class="ms-auto d-flex gap-2">
      <a class="btn btn-outline-brand position-relative" href="/cart">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-cart3 me-1" viewBox="0 0 16 16">
          <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .49.598l-1 5a.5.5 0 0 1-.465.401l-9.397.472L4.415 11H13a.5.5 0 0 1 0 1H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5zM3.102 4l.84 4.479 9.144-.459L13.89 4H3.102zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
        </svg>
        Корзина
        <span id="cartBadge" class="position-absolute top-0 start-100 translate-middle badge d-none">
          0
        </span>
      </a>
      <a class="btn-brand-call" href="tel:+79641027995" title="Позвонить +7 (964) 102-79-95">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-telephone-outbound-fill" viewBox="0 0 16 16">
          <path fill-rule="evenodd" d="M1.885.511a1.745 1.745 0 0 1 2.61.163L6.29 2.98c.329.423.445.974.315 1.494l-.547 2.19a.68.68 0 0 0 .178.643l2.457 2.457a.68.68 0 0 0 .644.178l2.189-.547a1.75 1.75 0 0 1 1.494.315l2.306 1.794c.829.645.905 1.87.163 2.611l-1.034 1.034c-.74.74-1.846 1.065-2.877.702a18.6 18.6 0 0 1-7.01-4.42 18.6 18.6 0 0 1-4.42-7.009c-.362-1.03-.037-2.137.703-2.877L1.885.511zM11 .5a.5.5 0 0 1 .5-.5h4a.5.5 0 0 1 .5.5v4a.5.5 0 0 1-1 0V1.707l-4.146 4.147a.5.5 0 0 1-.708-.708L14.293 1H11.5a.5.5 0 0 1-.5-.5z"/>
        </svg>
      </a>
    </div>
  </div>
</nav>

{% if preview_period %}
<div class="container mt-3">
  <div class="alert alert-warning py-2">
    <strong>PREVIEW:</strong> {{ preview_period }}
    <a class="ms-2" href="/admin/preview?period=morning">Утро</a>
    <a class="ms-2" href="/admin/preview?period=evening">Вечер</a>
    <a class="ms-2" href="/">Обычный</a>
  </div>
</div>
{% endif %}

<main class="container py-3">
  {% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="container">
    <div class="d-flex justify-content-center align-items-center gap-4">
      <a href="tel:+79641027995" class="footer-btn" title="Позвонить +7 (964) 102-79-95">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" viewBox="0 0 16 16">
          <path fill-rule="evenodd" d="M1.885.511a1.745 1.745 0 0 1 2.61.163L6.29 2.98c.329.423.445.974.315 1.494l-.547 2.19a.68.68 0 0 0 .178.643l2.457 2.457a.68.68 0 0 0 .644.178l2.189-.547a1.75 1.75 0 0 1 1.494.315l2.306 1.794c.829.645.905 1.87.163 2.611l-1.034 1.034c-.74.74-1.846 1.065-2.877.702a18.6 18.6 0 0 1-7.01-4.42 18.6 18.6 0 0 1-4.42-7.009c-.362-1.03-.037-2.137.703-2.877L1.885.511z"/>
        </svg>
      </a>
      <a href="https://t.me/sieshka_dostavka" target="_blank" class="footer-btn" title="Telegram">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" viewBox="0 0 16 16">
          <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM8.287 5.906c-.778.324-2.334.994-4.666 2.01-.378.15-.577.298-.595.442-.03.243.275.339.69.47l.175.055c.408.133.958.288 1.243.294.26.006.29-.023.39-.136.203-.223.808-.933 1.139-1.275.049-.05.1-.07.143-.05.042.02.058.07.053.13-.025.28-.19 1.08-.265 1.487-.03.166-.005.303.067.396a.34.34 0 0 0 .26.113c.13.002.326-.046.522-.127.642-.269 1.522-.876 1.875-1.088.39-.236.868-.518 1.22-.68.352-.163.608-.27.69-.294.158-.05.32-.057.446.01.083.045.143.122.174.21.047.138.04.342-.024.555-.138.46-.584 1.326-1.048 2.08-.466.757-.94 1.36-1.312 1.729-.388.385-.82.666-1.285.82-.465.155-.93.155-1.35.005-.42-.15-.776-.43-1.055-.82a3.26 3.26 0 0 1-.458-.91 4.6 4.6 0 0 1-.202-1.08c-.01-.21-.03-.46-.06-.74-.03-.28-.075-.57-.136-.87a5.87 5.87 0 0 0-.27-.93c-.12-.3-.265-.57-.43-.8A3.29 3.29 0 0 0 8.287 5.906z"/>
        </svg>
      </a>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
{% block scripts %}{% endblock %}
</body>
</html>
