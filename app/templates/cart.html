{% extends "base.html" %}
{% block title %}Корзина{% endblock %}

{% block content %}
<h1 class="h4 mb-3">
  <i class="bi bi-cart3 me-2"></i>Корзина
</h1>

<div id="cartReal" class="card shadow-sm">
  <div class="card-body">
    <div id="cart">
      <!-- Cart items will be rendered here -->
    </div>
  </div>
</div>

<div id="emptyCart" class="card shadow-sm d-none">
  <div class="card-body text-center py-5">
    <i class="bi bi-cart text-muted" style="font-size: 4rem;"></i>
    <h2 class="h5 text-muted mb-3 mt-3">Корзина пуста</h2>
    <p class="text-muted mb-4">Добавьте товары из меню, чтобы оформить заказ</p>
    <a href="/" class="btn btn-brand">
      <i class="bi bi-arrow-left me-2"></i>Перейти в меню
    </a>
  </div>
</div>

<div class="mt-3 d-flex gap-2" id="cartActions">
  <a class="btn btn-outline-brand" href="/">
    <i class="bi bi-arrow-left me-1"></i>Назад в меню
  </a>
  <button class="btn btn-outline-secondary" id="clearCartBtn">
    <i class="bi bi-trash me-1"></i>Очистить
  </button>
  <a class="btn btn-brand ms-auto" href="/checkout" id="checkoutBtn">
    Оформить<i class="bi bi-arrow-right ms-1"></i>
  </a>
</div>
{% endblock %}

{% block scripts %}
<script nonce="{{ csp_nonce }}">
  function initCartPage() {
    // Initialize cart page
    if (typeof CartManager !== 'undefined') {
      CartManager.renderCartPage();
      CartManager.updateNavbarCart();
    }
    
    // Setup clear button
    const clearBtn = document.getElementById('clearCartBtn');
    if (clearBtn && typeof CartManager !== 'undefined') {
      clearBtn.addEventListener('click', function() {
        if (confirm('Очистить корзину?')) { // Оставляем confirm здесь для соответствия UX
          CartManager.clearCart();
        }
      });
    }
  }
  
  // CartManager loads with defer, so we need to wait
  if (typeof CartManager !== 'undefined') {
    initCartPage();
  } else {
    // Wait for cart.js to load
    const checkCart = setInterval(function() {
      if (typeof CartManager !== 'undefined') {
        clearInterval(checkCart);
        initCartPage();
      }
    }, 100);
    // Stop checking after 5 seconds
    setTimeout(function() { clearInterval(checkCart); }, 5000);
  }
</script>
{% endblock %}
