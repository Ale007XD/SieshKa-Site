{% extends "base.html" %}
{% block title %}Корзина{% endblock %}

{% block content %}
<h1 class="h4 mb-3">Корзина</h1>

<div id="cartReal" class="card shadow-sm">
  <div class="card-body">
    <div id="cart"></div>
  </div>
</div>

<div id="emptyCart" class="card shadow-sm d-none">
  <div class="card-body text-center py-5">
    <h2 class="h5 text-muted mb-3">Корзина пуста</h2>
    <p class="text-muted mb-4">Добавьте товары из меню, чтобы оформить заказ</p>
    <a href="/" class="btn btn-brand">Перейти в меню</a>
  </div>
</div>

<div class="mt-3 d-flex gap-2" id="cartActions">
  <a class="btn btn-outline-brand" href="/">Назад в меню</a>
  <button class="btn btn-outline-secondary" onclick="cartClear(); return false;">Очистить</button>
  <a class="btn btn-brand ms-auto" href="/checkout" id="checkoutBtn">Оформить</a>
</div>
{% endblock %}

{% block scripts %}
<script nonce="{{ csp_nonce }}">
  document.addEventListener('DOMContentLoaded', function() {
    initCartPage();
  });
</script>
{% endblock %}
