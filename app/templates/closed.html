{% extends "base.html" %}
{% block title %}Закрыто{% endblock %}

{% block content %}
<div class="card shadow-sm">
  <div class="card-body text-center py-5">
    <h1 class="h4 mb-3">Сейчас не принимаем заказы</h1>
    <p class="text-muted mb-4">Пожалуйста, зайдите в часы работы:</p>
    
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="d-flex justify-content-center gap-4">
          <div class="text-center">
            <div class="fw-semibold">Утреннее меню</div>
            <div class="text-muted">{{ morning_start }} – {{ morning_end }}</div>
          </div>
          <div class="text-muted">|</div>
          <div class="text-center">
            <div class="fw-semibold">Вечернее меню</div>
            <div class="text-muted">{{ evening_start }} – {{ evening_end }}</div>
          </div>
        </div>
      </div>
    </div>
    
    <div class="mt-4">
      <a href="/" class="btn btn-brand">Обновить</a>
    </div>
  </div>
</div>
{% endblock %}
