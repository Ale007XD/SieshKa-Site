# Runtime upstream configuration for Blue/Green deployment
# This file is mounted with :rw to allow runtime switching
# 
# To switch active color:
#   echo 'set $api_upstream "api_blue";' > ./nginx/upstream.runtime.conf
#   docker compose exec nginx nginx -s reload
#
# Valid values:
#   set $api_upstream "api_blue";
#   set $api_upstream "api_green";

set $api_upstream "api_green";
