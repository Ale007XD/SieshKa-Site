name: Deploy Blue (Main)

on:
  workflow_dispatch:
    inputs:
      color:
        description: 'Confirm color (should be blue)'
        required: true
        default: 'blue'
        type: choice
        options:
          - blue

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/SieshKa-Site
            git fetch origin main
            git checkout main
            git pull origin main

            # Сборка и запуск Blue на порту 8001
            docker compose up -d --build api-blue
            docker compose exec -T api-blue alembic upgrade head

            # Переключение Nginx на Blue:8001
            echo "upstream api_backend { server api-blue:8001; }" | docker compose exec -T nginx tee /etc/nginx/conf.d/upstream.runtime.conf > /dev/null
            docker compose exec -T nginx nginx -s reload
