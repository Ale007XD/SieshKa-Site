name: Apply cart.js hotfix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-cart-hotfix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create hotfix branch
        run: |
          BRANCH="hotfix/cart-deliveryfee-tdz"
          git checkout -b "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Apply cart.js hotfix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/static/js/cart.js")
          if not path.exists():
              raise SystemExit("File not found: app/static/js/cart.js")

          text = path.read_text(encoding="utf-8")

          old_1 = "const deliveryFee = totalItems > 0 && deliveryFeeLoaded ? deliveryFee : 0;"
          new_1 = "const currentDeliveryFee = totalItems > 0 && deliveryFeeLoaded ? deliveryFee : 0;"

          old_2 = "const totalPrice = subtotal + deliveryFee;"
          new_2 = "const totalPrice = subtotal + currentDeliveryFee;"

          old_3 = "    updateNavbarCart();"
          new_3 = "    await updateNavbarCart();"

          if old_1 not in text:
              raise SystemExit("Target line not found: " + old_1)
          if old_2 not in text:
              raise SystemExit("Target line not found: " + old_2)
          if old_3 not in text:
              raise SystemExit("Target line not found: " + old_3)

          text = text.replace(old_1, new_1, 1)
          text = text.replace(old_2, new_2, 1)
          text = text.replace(old_3, new_3, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Show diff
        run: |
          git diff -- app/static/js/cart.js

      - name: Commit changes
        run: |
          git add app/static/js/cart.js
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "fix(cart): avoid TDZ in navbar delivery fee update"

      - name: Push branch
        run: |
          git push --set-upstream origin "$BRANCH"
