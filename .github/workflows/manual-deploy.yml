name: Manual Deploy (Hot Refactor)

on:
  workflow_dispatch:
    inputs:
      color:
        description: 'Which color to deploy (blue/green)'
        required: true
        default: 'blue'
        type: choice
        options:
          - blue
          - green

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Гарантируем, что запуск идет именно из этой ветки
    if: github.ref == 'refs/heads/hot-refactor' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd ~/SieshKa-Site
            
            # Переключение на нужную ветку и обновление
            git fetch origin
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}

            # Сборка и запуск (порт 8001)
            docker compose up -d --build api-${{ github.event.inputs.color }}
            # Автоматический прогон миграций Alembic
            docker compose exec -T api-${{ github.event.inputs.color }} alembic upgrade head
            # Переключение Nginx на активный цвет
            echo "upstream api_backend { server api-${{ github.event.inputs.color }}:8001; }" | docker compose exec -T nginx tee /etc/nginx/conf.d/upstream.runtime.conf > /dev/null
            docker compose exec -T nginx nginx -s reload
