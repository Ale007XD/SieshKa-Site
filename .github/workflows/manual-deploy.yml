name: Deploy Green (Hot Refactor)

on:
  workflow_dispatch:
    inputs:
      color:
        description: 'Confirm color (should be green)'
        required: true
        default: 'green'
        type: choice
        options:
          - green

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/hot-refactor'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/SieshKa-Site
            git fetch origin hot-refactor
            git checkout hot-refactor
            git pull origin hot-refactor

            # Сборка и запуск Green на порту 8002
            docker compose up -d --build api-green
            docker compose exec -T api-green alembic upgrade head

            # Переключение Nginx на Green:8002
            echo "upstream api_backend { server api-green:8002; }" | docker compose exec -T nginx tee /etc/nginx/conf.d/upstream.runtime.conf > /dev/null
            docker compose exec -T nginx nginx -s reload
